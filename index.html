<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denis Sentimenti · flushdesign</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  /* misure dal frame Figma (1082px di larghezza) espresse in vw */
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #fff; }
  body {
    font: 400 3.9vw/1.2 "IBM Plex Sans", system-ui, sans-serif; color: #000;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column;
    padding: max(9vw, env(safe-area-inset-top)) 9.7vw max(7vw, env(safe-area-inset-bottom));
  }

  /* card: tap flips photo → QR */
  .card { aspect-ratio: 1; perspective: 1200px; cursor: pointer; }
  .card > div {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4,0,.2,1);
  }
  .card.flipped > div { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 6%; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .back { transform: rotateY(180deg); display: grid; place-items: center; background: #000; }
  .back img { width: 68%; height: auto; }

  .who { margin-top: 13.8vw; }

  /* chips: horizontal scroll, invert on tap */
  .links { display: flex; gap: 2.3vw; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 12vw; scrollbar-width: none; margin: 13.8vw -12vw 0; padding: 2px 12vw; }
  .links::-webkit-scrollbar { display: none; }
  .links a {
    flex: 0 0 auto; scroll-snap-align: start; min-width: 25.4vw; padding: 0 3vw; line-height: 5.8vw;
    border: 1px solid #000; border-radius: 1.85vw; text-align: center;
    color: #000; text-decoration: none; font-size: 3.33vw;
    transition: background .1s, color .1s;
  }
  .links a:active, .links a:focus-visible { background: #000; color: #fff; outline: none; }

  footer { margin-top: auto; padding-top: 12vw; display: flex; justify-content: space-between; align-items: flex-end; }
  footer b { font-weight: 400; font-size: 4.44vw; }
  .dots { display: grid; grid-template-columns: repeat(3, .85vw); gap: 5.3vw 4.8vw; margin-bottom: .6vw; }
  .dots i { width: .85vw; height: .85vw; background: #000; border-radius: 50%; }

  @media (min-width: 600px) { body { max-width: 600px; margin: 0 auto; font-size: 23px; } .links a { font-size: 20px; } footer b { font-size: 27px; } }
  @media (prefers-reduced-motion: reduce) { .card > div { transition: none; } }
</style>
</head>
<body>

<div class="card" onclick="this.classList.toggle('flipped')" role="button" tabindex="0" aria-label="Foto: tocca per il QR con il contatto">
  <div>
    <div class="face"><img src="card.png" alt="Denis Sentimenti"></div>
    <div class="face back"><img src="qr.svg" alt="QR con la vCard di Denis Sentimenti"></div>
  </div>
</div>

<p class="who">Denis Sentimenti<br>Head of Design / Senior Art Director</p>

<nav class="links">
  <a href="https://www.flushdesign.it" target="_blank" rel="noopener">flushdesign.it</a>
  <a href="https://www.linkedin.com/in/denissentimenti/" data-app="linkedin://in/denissentimenti">linkedin</a>
  <a href="https://sgtpepe.notion.site/effed2e1eeda4d0b9b7c78e0f87373c3?pvs=143" target="_blank" rel="noopener">portfolio</a>
  <a href="denis.vcf" id="share">invia contatto</a>
</nav>

<footer>
  <b>flushdesign</b>
  <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</footer>

<script>
  // ponytail: keyboard flip only; no service worker (GitHub Pages is https, "aggiungi a Home" works without)
  document.querySelector('.card').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.currentTarget.click(); } });

  // invia contatto: share sheet nativo (AirDrop, WhatsApp, Mail...) con il .vcf; fallback: apre il file
  share.onclick = async e => {
    if (!navigator.share) return;
    e.preventDefault();
    const f = new File([await (await fetch('denis.vcf')).blob()], 'Denis Sentimenti.vcf', {type:'text/vcard'});
    navigator.share(navigator.canShare?.({files:[f]}) ? {files:[f]} : {title:'Denis Sentimenti', url:location.href});
  };

  // app prima, sito se l'app non c'è (iOS apre gli https in Safari anche con l'app installata)
  for (const a of document.querySelectorAll('[data-app]')) a.onclick = e => {
    e.preventDefault(); location.href = a.dataset.app;
    setTimeout(() => { if (!document.hidden) window.open(a.href, "_blank"); }, 800);
  };
</script>
</body>
</html>
